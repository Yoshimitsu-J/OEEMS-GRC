<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#400505">
  <title>OEEMS Demo | Select a Portal</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #f4f2f2;
      color: #281a1a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 90% 0%, rgba(128, 0, 0, 0.08), transparent 38rem),
        #f4f2f2;
    }

    .page-shell {
      width: min(100% - 2rem, 68rem);
      margin: 0 auto;
      padding: 2rem 0 3rem;
    }

    .site-header {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #ded6d6;
    }

    .brand-mark {
      display: grid;
      width: 3.25rem;
      aspect-ratio: 1;
      place-items: center;
      flex: 0 0 auto;
      background: #400505;
      color: #fff;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .brand-name {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 700;
    }

    main {
      padding-top: clamp(3rem, 10vh, 6.5rem);
    }

    .eyebrow {
      margin: 0 0 0.75rem;
      color: #800000;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 48rem;
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1.08;
    }

    .portal-grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 2.5rem;
    }

    .portal-card {
      display: flex;
      min-height: 12rem;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      padding: 1.5rem;
      border: 1px solid #ded6d6;
      background: #fff;
      color: inherit;
      text-decoration: none;
      transition: border-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .portal-card:hover,
    .portal-card:focus-visible {
      transform: translateY(-3px);
      border-color: #800000;
      box-shadow: 0 14px 32px rgba(64, 5, 5, 0.14);
    }

    .portal-card:focus-visible {
      outline: 3px solid #e0a834;
      outline-offset: 3px;
    }

    .portal-type {
      margin: 0 0 0.55rem;
      color: #685858;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .portal-card h2 {
      margin: 0;
      font-size: 1.65rem;
    }

    .portal-action {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      margin-top: 2rem;
      padding-top: 0.9rem;
      border-top: 1px solid #e8e1e1;
      color: #800000;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .portal-arrow {
      font-size: 1.25rem;
      transition: transform 160ms ease;
    }

    .portal-card:hover .portal-arrow,
    .portal-card:focus-visible .portal-arrow {
      transform: translateX(4px);
    }

    @media (min-width: 42rem) {
      .page-shell {
        padding-top: 2.5rem;
      }

      .portal-grid {
        flex-direction: row;
        gap: 1.25rem;
      }

      .portal-card {
        min-height: 15rem;
        flex: 1;
        padding: 2rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <div class="brand-mark" aria-hidden="true">OEEMS</div>
      <p class="brand-name">Global Reciprocal Colleges</p>
    </header>

    <main>
      <p class="eyebrow">Demo Application</p>
      <h1>Online Entrance Examination Management System Demo App</h1>

      <nav class="portal-grid" aria-label="Choose a portal">
        <a class="portal-card" href="/public/index.html">
          <div>
            <p class="portal-type">Applicant access</p>
            <h2>Student</h2>
          </div>
          <span class="portal-action">Open student portal <span class="portal-arrow" aria-hidden="true">&rarr;</span></span>
        </a>

        <a class="portal-card" href="/public/admission/index.html">
          <div>
            <p class="portal-type">Staff access</p>
            <h2>Admission</h2>
          </div>
          <span class="portal-action">Open admission portal <span class="portal-arrow" aria-hidden="true">&rarr;</span></span>
        </a>
      </nav>
    </main>
  </div>

  <script>
    document.querySelectorAll('.portal-card').forEach((card) => {
      card.addEventListener('click', () => {
        card.setAttribute('aria-busy', 'true');
      });
    });
  </script>
</body>
</html>
