<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRC Examination Login</title>
  <style>
    :root { font-family: "Segoe UI", sans-serif; color: #281a1a; background: #f4f2f2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, rgba(128,0,0,.12), transparent 40rem), #f4f2f2; }
    .login-card { width: min(92vw, 440px); padding: 28px; background: white; border-top: 5px solid #800000; box-shadow: 0 18px 50px rgba(64,5,5,.16); }
    h1 { margin: 0 0 8px; color: #800000; }
    label { display: grid; gap: 7px; font-weight: 700; }
    input { height: 44px; padding: 10px; border: 1px solid #bbaaaa; text-transform: uppercase; }
    button { width: 100%; height: 44px; margin-top: 14px; border: 0; background: #800000; color: white; font-weight: 800; cursor: pointer; }
    .error { min-height: 20px; color: #a00000; }
    dialog { width: min(92vw, 520px); border: 0; border-radius: 8px; padding: 24px; }
    dialog::backdrop { background: rgba(0,0,0,.65); }
    .details { display: grid; gap: 8px; margin: 18px 0; }
    .actions { display: flex; justify-content: flex-end; gap: 10px; }
    .actions button { width: auto; padding: 0 18px; }
    .secondary { background: #fff; border: 1px solid #777; color: #333; }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>Examination Module</h1>
    <p>Enter the Application Code shown on your Statement of Application.</p>
    <label>Application Code<input id="applicationCode" autocomplete="off" maxlength="32" placeholder="APP2026XXXXXX"></label>
    <p id="loginError" class="error" role="alert"></p>
    <button id="submitApplicationCode" type="button">Submit</button>
  </main>

  <dialog id="verificationDialog" aria-labelledby="verificationTitle">
    <h2 id="verificationTitle">Verify Applicant Information</h2>
    <div class="details">
      <strong>Applicant ID: <span id="verificationApplicantId"></span></strong>
      <strong>Name: <span id="verificationName"></span></strong>
      <strong>Email: <span id="verificationEmail"></span></strong>
    </div>
    <div class="actions">
      <button type="button" class="secondary" id="notMeButton">This wasn't me</button>
      <button type="button" id="itsMeButton">It's me</button>
    </div>
  </dialog>

  <script src="login.js"></script>
</body>
</html>
