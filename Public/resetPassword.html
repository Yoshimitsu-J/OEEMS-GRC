<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#800000">
  <title>Reset Password | OEEMS</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-page-shell">
    <section class="auth-card" aria-labelledby="resetTitle">
      <p class="auth-eyebrow">Global Reciprocal Colleges</p>
      <h1 id="resetTitle">Reset Password</h1>
      <p class="auth-subtitle">Create a new password for your student account.</p>
      <form id="resetPasswordForm" class="auth-form">
        <label class="auth-field" for="newPassword">
          <span>New Password</span>
          <input id="newPassword" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        </label>
        <ul class="password-rules" aria-label="Password requirements">
          <li id="rule-length">At least 8 characters</li>
          <li id="rule-case">Contains uppercase and lowercase letters</li>
          <li id="rule-number">At least 1 number</li>
          <li id="rule-special">At least 1 special character: _ / ! @ #</li>
        </ul>
        <label class="auth-field" for="confirmPassword">
          <span>Confirm New Password</span>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        </label>
        <p class="auth-message" id="passwordMatchMessage" aria-live="polite"></p>
        <button class="auth-primary" id="resetPasswordButton" type="submit" disabled>Reset Password</button>
        <p class="auth-message" id="resetPasswordMessage" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <dialog id="passwordResetSuccess" class="auth-dialog auth-success-dialog" aria-labelledby="resetSuccessTitle">
    <h2 id="resetSuccessTitle">Password reset successfully</h2>
    <p class="auth-subtitle">Login now</p>
    <button class="auth-primary" id="resetSuccessOk" type="button">OK</button>
  </dialog>
  <script src="js/resetPassword.js"></script>
</body>
</html>
