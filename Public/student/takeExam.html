<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRC-CAT Examination - Global Reciprocal Colleges</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/exam.css">
</head>
<body>

  <header class="top-header">
    <div class="brand">
      <h1>GRC-CAT Entrance Examination</h1>
    </div>
    <div class="exam-top-bar">
      &#9200; Time Remaining: <span class="exam-timer" data-exam-timer>15:00</span>
    </div>
  </header>

  <div class="app-container exam-layout">
    <main class="main-content exam-main">
      <div class="exam-meta">
        <span class="exam-category-tag">Logical reasoning</span>
        <span class="exam-question-count">Question 1 of 9</span>
      </div>

      <div class="card exam-card">
        <h3 class="exam-question">Which figure completes the series?</h3>

        <form action="examResult.html">
          <label class="option-item"><input type="radio" name="answer" value="A" required> <span>A. A</span></label>
          <label class="option-item"><input type="radio" name="answer" value="B"> <span>B. B</span></label>
          <label class="option-item"><input type="radio" name="answer" value="C"> <span>C. C</span></label>
          <label class="option-item"><input type="radio" name="answer" value="D"> <span>D. D</span></label>

          <button type="submit" class="btn-primary exam-next-btn">NEXT</button>
        </form>
      </div>
    </main>
  </div>

  <script src="js/applicantExam.js"></script>
  <script src="js/applicantGuard.js"></script>
  <script src="js/applicantCommon.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
