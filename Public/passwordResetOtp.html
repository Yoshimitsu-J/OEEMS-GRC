<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#800000">
  <title>Verify Reset Code | OEEMS</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-page-shell">
    <a class="auth-back-link" href="forgotPassword.html">&larr; Change email</a>
    <section class="auth-card" aria-labelledby="verifyResetTitle">
      <p class="auth-eyebrow">Global Reciprocal Colleges</p>
      <h1 id="verifyResetTitle">Verify your Email Address</h1>
      <p class="auth-subtitle">We sent an OTP Verification code to <span id="resetEmailDisplay"></span>.</p>
      <p class="auth-message warning" id="resetDevNote" hidden>Development Mode: OTP logged to server terminal.</p>
      <form id="resetOtpForm" class="auth-form">
        <label for="reset-otp-1">Six-digit verification code</label>
        <div class="otp-digit-row" role="group" aria-label="Six-digit verification code">
          <input class="otp-digit" id="reset-otp-1" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]" maxlength="1" aria-label="Digit 1" required>
          <input class="otp-digit" id="reset-otp-2" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" aria-label="Digit 2" required>
          <input class="otp-digit" id="reset-otp-3" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" aria-label="Digit 3" required>
          <input class="otp-digit" id="reset-otp-4" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" aria-label="Digit 4" required>
          <input class="otp-digit" id="reset-otp-5" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" aria-label="Digit 5" required>
          <input class="otp-digit" id="reset-otp-6" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" aria-label="Digit 6" required>
        </div>
        <p id="resetCountdown" class="auth-message" aria-live="polite">Code expires in 02:00</p>
        <div class="auth-form">
          <button class="auth-primary" id="verifyResetOtpButton" type="submit" disabled>Verify Email</button>
          <button class="auth-secondary" id="resendResetOtpButton" type="button" disabled>Resend Code</button>
        </div>
        <p class="auth-message" id="resetOtpMessage" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="js/passwordResetOtp.js"></script>
</body>
</html>
