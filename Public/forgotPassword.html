<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#800000">
  <title>Forgot Password | OEEMS</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-page-shell">
    <a class="auth-back-link" href="/public/index.html">&larr; Back to login</a>
    <section class="auth-card" aria-labelledby="forgotTitle">
      <p class="auth-eyebrow">Global Reciprocal Colleges</p>
      <h1 id="forgotTitle">Forgot Password?</h1>
      <p class="auth-subtitle">Enter the email address associated with your student account.</p>
      <form id="forgotPasswordForm" class="auth-form">
        <label class="auth-field" for="resetEmail">
          <span>Email Address</span>
          <input id="resetEmail" name="email" type="email" autocomplete="email" placeholder="Enter your email address" required maxlength="254">
        </label>
        <button class="auth-primary" id="requestOtpButton" type="submit" disabled>Confirm and Verify with OTP</button>
        <p class="auth-message" id="forgotMessage" role="status" aria-live="polite"></p>
      </form>
      <p class="auth-footer">Remember your password? <a href="/public/index.html">Login</a></p>
    </section>
  </main>
  <script src="js/forgotPassword.js"></script>
</body>
</html>
