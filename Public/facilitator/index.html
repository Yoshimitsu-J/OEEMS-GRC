<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRC Facilitator Mode</title>
  <style>
    :root { font-family: "Segoe UI", sans-serif; color: #281a1a; background: #f4f2f2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    .topbar { height: 72px; padding: 0 24px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #ddd1d1; background: white; }
    h1 { margin: 0; color: #800000; font-size: 22px; }
    main { width: min(94vw, 760px); margin: 36px auto; }
    .panel { padding: 24px; border-top: 5px solid #800000; border-radius: 6px; background: white; box-shadow: 0 10px 30px rgba(60,0,0,.08); }
    .login-panel { width: min(92vw, 420px); }
    label { display: grid; gap: 8px; margin-bottom: 14px; font-weight: 800; }
    input { height: 48px; padding: 10px 12px; border: 1px solid #aaa; border-radius: 4px; font-size: 16px; }
    button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 5px; background: #800000; color: white; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .error { min-height: 22px; color: #a00000; }
    .lookup-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    .lookup-row input { text-transform: uppercase; }
    #scannerPanel { display: none; margin-top: 18px; }
    #video { width: 100%; max-height: 420px; border-radius: 6px; background: #111; object-fit: cover; }
    #studentCard { display: none; margin-top: 18px; padding: 18px; border: 1px solid #ddd; }
    .student-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; }
    .student-grid strong { color: #800000; }
    .actions { margin-top: 18px; display: flex; justify-content: flex-end; gap: 10px; }
    .secondary { border: 1px solid #777; background: white; color: #333; }
    @media (max-width: 620px) { .lookup-row { grid-template-columns: 1fr; } .student-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="topbar"><h1>GRC-CAT Entrance Examination Facilitator</h1></header>
  <main>
    <section id="loginPanel" class="panel login-panel">
      <h2>Facilitator Login</h2>
      <label>Access Code<input id="accessCode" type="password" autocomplete="off"></label>
      <p id="loginError" class="error"></p>
      <button id="loginButton" type="button">LOGIN</button>
    </section>

    <section id="facilitatorPanel" class="panel" hidden>
      <div id="facilitatorIdentity"></div>
      <div class="lookup-row">
        <label>Enter Application ID<input id="applicationIdInput" autocomplete="off" maxlength="32"></label>
        <button id="lookupButton" type="button">VERIFY</button>
      </div>
      <button id="scanButton" class="secondary" type="button">SCAN QR CODE</button>
      <div id="scannerPanel"><video id="video" autoplay muted playsinline></video><canvas id="qrCanvas" hidden></canvas></div>
      <p id="lookupError" class="error"></p>
      <section id="studentCard">
        <h2>APPLICANT INFORMATION</h2>
        <div class="student-grid">
          <div><strong>Name</strong><div id="studentName"></div></div>
          <div><strong>Applicant ID</strong><div id="studentApplicantId"></div></div>
          <div><strong>Application ID</strong><div id="studentApplicationId"></div></div>
          <div><strong>Approval Status</strong><div id="studentApprovalStatus"></div></div>
          <div><strong>Exam Date</strong><div id="studentExamDate"></div></div>
          <div><strong>Exam Batch / Time</strong><div id="studentExamTime"></div></div>
          <div><strong>Mobile Number</strong><div id="studentMobile"></div></div>
          <div><strong>Email Address</strong><div id="studentEmail"></div></div>
        </div>
        <div class="actions"><button id="closeStudentButton" class="secondary" type="button">CLOSE</button><button id="confirmArrivalButton" type="button">CONFIRM ARRIVAL</button></div>
      </section>
    </section>
  </main>
  <script src="/js/jsQR.js"></script>
  <script src="facilitator.js"></script>
</body>
</html>
