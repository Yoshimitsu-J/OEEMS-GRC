<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - OEEMS</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="signup-body">

  <nav class="grc-navbar">
    <div class="grc-navbar-inner">
      <a href="index.html" class="grc-navbar-brand">
        <img src="assets/image/grc-logo.png" alt="GRC Logo" class="grc-navbar-logo">
        <span>OEEMS</span>
      </a>
      <ul class="grc-navbar-nav">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#about-us">Contact</a></li>
      </ul>
    </div>
  </nav>

  <div class="login-wrapper">
    <div class="login-box">
      <h2>LOGIN</h2>

      <form id="loginForm">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com">

        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" required placeholder="Enter your password">
        </div>

        <div class="forgot-pass-container">
          <a href="forgotPassword.html">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-login">LOGIN</button>

        <a class="btn-primary btn-block google-auth-button" href="/api/auth/google?intent=login">Continue with Google</a>

        <div id="message"></div>

        <div class="signup-link-container">
          Don't have an account? <a href="signUp.html">Sign Up</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
